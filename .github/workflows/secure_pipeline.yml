name: Secure Pipeline

on:
  pull_request:
    branches:
      - test
      - main

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:

  security-check:

    runs-on: ubuntu-latest

    env:
      TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

    steps:

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Dependencies
        run: |
          pip install -r requirements.txt
          pip install requests pytest

      - name: Telegram Inicio
        run: |
          python - <<EOF
          import requests, os

          requests.post(
              f"https://api.telegram.org/bot{os.environ['TELEGRAM_TOKEN']}/sendMessage",
              json={
                  "chat_id": os.environ["TELEGRAM_CHAT_ID"],
                  "text": "🔍 Inicio revisión de seguridad"
              }
          )
          EOF

      - name: Obtener archivos modificados
        run: |
          git diff --name-only \
          ${{ github.event.pull_request.base.sha }} \
          ${{ github.event.pull_request.head.sha }} > files.txt

          echo "Archivos modificados:"
          cat files.txt

      - name: Security Check
        id: security
        continue-on-error: true
        run: |

          found=0

          while read file
          do

            if [[ "$file" == *.py || "$file" == *.c || "$file" == *.cpp ]]
            then

              if [ -f "$file" ]
              then

              echo "Analizando $file"

              found=1

              python src/ci_cd/security_check.py "./$file"

              if [ $? -ne 0 ]
              then
                exit 1
              fi
            else
                echo "Archivo $file no encontrado, omitiendo"
              fi
            fi

          done < files.txt

          if [ $found -eq 0 ]
          then
            echo "No se encontraron archivos fuente para analizar"
          fi

      - name: Run Tests
        if: steps.security.outcome == 'success'
        run: |
          pytest

      - name: Telegram Tests Exitosos
        if: steps.security.outcome == 'success'
        run: |
          python - <<EOF
          import requests, os

          requests.post(
              f"https://api.telegram.org/bot{os.environ['TELEGRAM_TOKEN']}/sendMessage",
              json={
                  "chat_id": os.environ["TELEGRAM_CHAT_ID"],
                  "text": "🧪 Pruebas ejecutadas correctamente"
              }
          )
          EOF

      - name: Telegram Codigo Seguro
        if: steps.security.outcome == 'success'
        run: |
          python - <<EOF
          import requests, os

          requests.post(
              f"https://api.telegram.org/bot{os.environ['TELEGRAM_TOKEN']}/sendMessage",
              json={
                  "chat_id": os.environ["TELEGRAM_CHAT_ID"],
                  "text": "✅ Código seguro - Continuando pipeline"
              }
          )
          EOF

      - name: Comment Pull Request
        if: steps.security.outcome == 'failure'
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          message: |
            ❌ Vulnerabilidad detectada por IA

            Resultado: VULNERABLE

            El merge fue bloqueado.

      - name: Create Issue
        if: steps.security.outcome == 'failure'
        uses: dacbd/create-issue-action@main
        with:
          token: ${{ github.token }}
          title: Vulnerabilidad detectada
          body: |
            El pipeline detectó una vulnerabilidad.

            Pull Request:
            ${{ github.event.pull_request.html_url }}

      - name: Telegram Vulnerabilidad
        if: steps.security.outcome == 'failure'
        run: |
          python - <<EOF
          import requests, os

          requests.post(
              f"https://api.telegram.org/bot{os.environ['TELEGRAM_TOKEN']}/sendMessage",
              json={
                  "chat_id": os.environ["TELEGRAM_CHAT_ID"],
                  "text": "🚨 Vulnerabilidad detectada. PR bloqueado."
              }
          )
          EOF

      - name: Fail Job
        if: steps.security.outcome == 'failure'
        run: exit 1